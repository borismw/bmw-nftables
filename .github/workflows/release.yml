---
name: Release bmw-nftables

on:
  push:
    tags:
      - 'v*'
env:
  PKG_NAME: bmw-nftables
  REPOSITORY_NAME: bmw-nftables

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    container: debian:stable
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends build-essential debhelper devscripts git make
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "pkgver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build source archive and .deb
        run: make deb pkgver=${{ steps.version.outputs.pkgver }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.PKG_NAME }} v${{ steps.version.outputs.pkgver }}
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            build/${{ env.PKG_NAME }}-v${{ steps.version.outputs.pkgver }}-sources.tar.gz
            build/deb/${{ env.PKG_NAME }}_${{ steps.version.outputs.pkgver }}-1_all.deb

  update-pkgbuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute sha256sum
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --pattern "${{ env.PKG_NAME }}-v${{ steps.version.outputs.version }}-sources.tar.gz" \
            --dir /tmp
          sha256sum="/tmp/${{ env.PKG_NAME }}-v${{ steps.version.outputs.version }}-sources.tar.gz"
          echo "sha256=$(sha256sum "$sha256sum" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        id: checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PKGBUILD
        working-directory: package/archlinux
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=(\"${{ steps.checksum.outputs.sha256 }}\" \"SKIP\")/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Update debian/changelog
        working-directory: package/debian
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends devscripts
          DEBEMAIL="52957119+borismw@users.noreply.github.com" DEBFULLNAME="borismw" \
            dch -b -v "${{ steps.version.outputs.version }}-1" --distribution unstable --force-distribution \
            "Release ${{ steps.version.outputs.version }}."

      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/${{ env.PKG_NAME }}-v${{ steps.version.outputs.version }}
          title: "chore: bump bmw-nftables to v${{ steps.version.outputs.version }}"
          body: |
            Auto-generated by the ${{ env.PKG_NAME }} release workflow.

            Updates `pkgver` and `sha256sums` in the PKGBUILD and `debian/changelog` to match
            release [${{ env.PKG_NAME }}/v${{ steps.version.outputs.version }}](https://github.com/borismw/${{ env.REPOSITORY_NAME }}/releases/tag/v${{ steps.version.outputs.version }}).
          commit-message: "chore: bump ${{ env.PKG_NAME }} to v${{ steps.version.outputs.version }}"
          add-paths: |
            package/archlinux/PKGBUILD
            package/debian/debian/changelog
