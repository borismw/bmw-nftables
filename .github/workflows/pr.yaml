---
name: ci_pr

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - name: Prepare for Bash Unit-Testing
        run: sudo apt update && sudo apt install shunit2 shfmt
      - name: Lint
        id: unit-tests
        run: make lint
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate package
        uses: heyhusen/archlinux-package-action@6e56ed13fbdb4899f264783ae2d70d7c397d9c0e
        with:
          path: 'package/archlinux'
          flags: ''
          namcap: true
          srcinfo: false
