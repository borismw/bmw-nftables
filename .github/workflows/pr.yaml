---
name: ci_pr

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          # Makefile invokes git describe to find out the version. This does not work without history.
          fetch-depth: '0'
      - name: Prepare for Bash Unit-Testing
        run: sudo apt update && sudo apt install shfmt

      - name: Lint
        id: lint
        run: make lint

      - name: Build source archive from PR
        run: |
          make release
          # Move the source files next to the PKGBUILD, so the following step uses the current repo state for validation
          mv build/bmw-nftables-v*-sources.tar.gz package/archlinux
      - name: Validate package
        uses: heyhusen/archlinux-package-action@c1d59873c60e6941831f2b10d7e24de07878a851
        with:
          path: 'package/archlinux'
          # Since the sources come from a file in the same directory, the integrity does not match
          flags: '--skipinteg'
          namcap: true
          srcinfo: false

  debian:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'dependabot[bot]'
    container: debian:stable
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends build-essential debhelper devscripts lintian git make
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'
      - name: Build .deb
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make deb
      - name: Lintian
        run: lintian --fail-on error,warning build/deb/*.deb
